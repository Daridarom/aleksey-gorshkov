name: Import archival gallery photos
on:
  push:
    paths:
      - '.github/workflows/import-galaktionov-photos.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download source photographs from Foundation article
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p galaktionov/assets
          curl --location --fail --retry 3 --max-time 60 --silent --show-error \
            --header 'Referer: https://fundgenerationbridge.org/' \
            --user-agent 'Mozilla/5.0' \
            'https://static.tildacdn.com/tild3835-6263-4931-b031-376638626262/m_K0VpP2CIs.jpg' \
            --output galaktionov/assets/galaktionov-bridge-2020-1.jpg
          curl --location --fail --retry 3 --max-time 60 --silent --show-error \
            --header 'Referer: https://fundgenerationbridge.org/' \
            --user-agent 'Mozilla/5.0' \
            'https://static.tildacdn.com/tild3166-3530-4661-b861-396135626263/dELlAKpV-K8.jpg' \
            --output galaktionov/assets/galaktionov-bridge-2020-2.jpg
          file galaktionov/assets/galaktionov-bridge-2020-{1,2}.jpg
          test "$(stat -c%s galaktionov/assets/galaktionov-bridge-2020-1.jpg)" -gt 5000
          test "$(stat -c%s galaktionov/assets/galaktionov-bridge-2020-2.jpg)" -gt 5000
      - name: Save in site repository
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add galaktionov/assets/galaktionov-bridge-2020-1.jpg galaktionov/assets/galaktionov-bridge-2020-2.jpg
          git diff --cached --quiet || git commit -m 'Add sourced gallery photos from Most Pokoleniy'
          git push
